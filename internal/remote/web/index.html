<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="neonmux">
<meta name="theme-color" content="#0b0a1a">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
<title>neonmux</title>
</head>
<body>
<main id="app">

<section id="home" class="screen" hidden>
  <header class="bar">
    <h1>neonmux</h1>
    <button id="home-settings" type="button" class="icon" aria-label="Settings">⚙</button>
  </header>
  <ul id="machines" class="list"></ul>
  <div class="actions"><button id="pair-btn" type="button" class="primary">Pair a machine</button></div>
</section>

<section id="pair" class="screen" hidden>
  <header class="bar"><button id="pair-cancel" type="button">Cancel</button><h1>Pair a machine</h1></header>
  <div id="pair-scan" class="scan"><video id="pair-video" playsinline muted></video></div>
  <form id="pair-name" class="form" hidden>
    <label for="pair-device">Name of this phone</label>
    <input id="pair-device" value="iPhone" maxlength="64" autocomplete="off" autocorrect="off" spellcheck="false">
    <button type="submit" class="primary">Continue</button>
  </form>
  <div id="pair-code" class="code" hidden>
    <p>Does the code on the computer match?</p>
    <p id="pair-sas" class="sas"></p>
  </div>
  <p id="pair-status" class="status" hidden></p>
</section>

<section id="term" class="screen" hidden>
  <header class="bar">
    <button id="t-list" type="button" aria-label="Terminals">☰</button>
    <span id="t-dot" class="dot" hidden></span>
    <h1 id="t-title"></h1>
    <span id="t-pos" class="pos" hidden></span>
    <button id="t-refit" type="button" class="icon" aria-label="Redraw">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 12a8 8 0 1 1-2.34-5.66"></path>
        <path d="M20 4v5h-5"></path>
      </svg>
    </button>
    <button id="t-copy" type="button" class="icon" aria-label="Copy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="8" y="4" width="8" height="4" rx="1"></rect>
        <path d="M8 6H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-2"></path>
      </svg>
    </button>
  </header>
  <p id="t-status" class="status" hidden></p>
  <div id="t-conn" class="conn-bar" hidden>
    <span id="t-conn-text"></span>
    <button id="t-conn-home" type="button">Machines</button>
  </div>
  <button id="t-banner" type="button" class="banner" hidden></button>
  <div id="band">
    <canvas id="screen"></canvas>
    <canvas id="screen-old" hidden></canvas>
    <div id="t-hint" class="toast" hidden></div>
  </div>
  <div id="t-sel" class="sel-bar" hidden>
    <span id="t-sel-n"></span>
    <button id="t-sel-cancel" type="button">Cancel</button>
    <button id="t-sel-copy" type="button" class="primary">Copy</button>
  </div>
  <div id="t-replies" class="replies" hidden></div>
  <div id="keys">
    <button type="button" data-key="esc">esc</button>
    <button type="button" data-key="tab">tab</button>
    <button type="button" id="k-ctrl">ctrl</button>
    <button type="button" id="k-shift" aria-label="shift">⇧</button>
    <button type="button" id="k-alt">alt</button>
    <button type="button" data-key="ctrlc" aria-label="hold for control C">^C</button>
    <button type="button" data-key="left" aria-label="left">←</button>
    <button type="button" data-key="down" aria-label="down">↓</button>
    <button type="button" data-key="up" aria-label="up">↑</button>
    <button type="button" data-key="right" aria-label="right">→</button>
    <button type="button" data-key="bksp" aria-label="backspace">⌫</button>
  </div>
  <div id="t-scheduled-banner" class="scheduled-banner" hidden></div>
  <div id="t-field">
    <textarea id="t-input" rows="1" enterkeyhint="enter" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
    <button type="button" id="t-send" aria-label="enter">
      <span class="send-label">⏎</span>
      <svg class="send-badge" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="8" cy="8.5" r="5.5"></circle>
        <path d="M8 5.5v3h2.5"></path>
        <path d="M6.5 1.5h3M8 1.5v1.5"></path>
      </svg>
    </button>
  </div>
</section>

<div id="schedule-sheet" class="sheet" hidden>
  <div class="panel">
    <header class="bar">
      <h1 id="schedule-title">Schedule command</h1>
      <button id="schedule-close" type="button" class="icon" aria-label="Close">✕</button>
    </header>
    <div id="schedule-limit-box" class="schedule-limit-box" hidden>
      <div class="schedule-limit-top">
        <div class="schedule-limit-badge">
          <span class="schedule-limit-icon">⏱</span>
          <span id="schedule-limit-app">Limit detected</span>
        </div>
        <span id="schedule-limit-reset" class="schedule-limit-pill"></span>
      </div>
      <div id="schedule-limit-text" class="schedule-limit-text"></div>
      <button id="schedule-limit-apply" type="button" class="primary schedule-action-btn">
        <span class="schedule-btn-icon">⚡</span> Resume at <span id="schedule-limit-time"></span>
      </button>
    </div>
    <div id="schedule-custom-label" class="schedule-section-label" hidden>Or custom schedule</div>
    <div class="theme-row schedule-row">
      <label for="schedule-time">Run at</label>
      <input type="text" id="schedule-time" class="schedule-input" placeholder="+5m, 1h30m, 17:21 (machine time)" enterkeyhint="go" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="actions schedule-chips">
      <button type="button" class="chip" data-time="+1m">+1m</button>
      <button type="button" class="chip" data-time="+5m">+5m</button>
      <button type="button" class="chip" data-time="+15m">+15m</button>
      <button type="button" class="chip" data-time="+1h">+1h</button>
    </div>
    <div class="theme-row schedule-row">
      <label for="schedule-cmd">Command</label>
      <input type="text" id="schedule-cmd" class="schedule-input" placeholder="continue" enterkeyhint="go" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <div id="schedule-pending-section" class="schedule-pending-section" hidden>
      <div class="schedule-section-label">Pending commands</div>
      <ul id="schedule-pending-list" class="schedule-pending-list"></ul>
    </div>
    <div id="schedule-status" class="hint schedule-status" role="status"></div>
    <div class="actions schedule-footer">
      <button id="schedule-cancel" type="button">Cancel</button>
      <button id="schedule-submit" type="button" class="primary">Schedule</button>
    </div>
  </div>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="panel">
    <header class="bar">
      <button id="sheet-machines" type="button">Machines</button>
      <h1 id="sheet-title"></h1>
      <button id="sheet-settings" type="button" class="icon" aria-label="Settings">⚙</button>
      <button id="sheet-close" type="button" class="icon" aria-label="Close">✕</button>
    </header>
    <ul id="sessions" class="list"></ul>
  </div>
</div>

<div id="settings" class="sheet" hidden>
  <div class="panel">
    <header class="bar">
      <h1>Settings</h1>
      <button id="settings-close" type="button" class="icon" aria-label="Close">✕</button>
    </header>
    <div id="theme-row" class="theme-row" hidden>
      <label for="sheet-theme">Theme</label>
      <select id="sheet-theme"></select>
    </div>
    <label class="toggle-row" for="sheet-slide">
      <span>Slide between terminals</span>
      <input type="checkbox" id="sheet-slide" class="toggle-input">
      <span class="toggle-slider"></span>
    </label>
    <label class="toggle-row" for="settings-push">
      <span>Notify when an agent is waiting</span>
      <input type="checkbox" id="settings-push" class="toggle-input">
      <span class="toggle-slider"></span>
    </label>
    <p id="settings-push-hint" class="hint settings-hint" hidden></p>
  </div>
</div>

<div id="mdetail" class="sheet" hidden>
  <div class="panel">
    <header class="bar">
      <h1 id="mdetail-title"></h1>
      <button id="mdetail-close" type="button" class="icon" aria-label="Close">✕</button>
    </header>
    <dl id="mdetail-rows" class="details"></dl>
    <div class="actions">
      <button id="mdetail-forget" type="button" class="danger">Forget</button>
      <button id="mdetail-open" type="button" class="primary">Connect</button>
    </div>
  </div>
</div>

<div id="notice" class="notice" hidden>
  <div class="panel">
    <p id="notice-text"></p>
    <div id="notice-actions" class="actions"></div>
  </div>
</div>

</main>
</body>
</html>
